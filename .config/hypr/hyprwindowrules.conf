windowrule = float,class:kitty

windowrule = float, class:pavucontrol
windowrule = float, title:Open File
windowrule = float, class:org.matplotlib.Matplotlib3
windowrule = float, class:nm-connection-editor
windowrule = float, title:Steam Settings
windowrule = float, title:Friends List
windowrule = float, title:.*Properties.*
windowrule = float, title:File Operation Progress
windowrule = float, class:qalculate-gtk

windowrule = float, title:.*Picture-in-Picture.*
# windowrule = pin,   title:.*Picture-in-Picture.*

windowrule = noblur, class:albert
windowrule = noborder, class:albert

windowrule = pin,   title:as_toolbar
windowrule = float, title:zoom_linux_float_video_window

windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
