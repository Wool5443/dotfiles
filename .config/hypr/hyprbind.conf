$main_mod = super

source = ~/.config/hypr/hyprapps.conf

# App start
bind = $main_mod, b, exec, $runPrefix $browser
bind = $main_mod, e, exec, $runPrefix $fileManager
bind = $main_mod, t, exec, $runPrefix $terminal
bind = $main_mod, c, exec, $runPrefix code --enable-features=UseOzonePlatform --ozone-platform=wayland

bind = $main_mod, f4, exec, hyprctl kill

# Tiling
# bind = $main_mod shift, q, exec, uwsm stop
# bind = $main_mod shift, q, exit
# bind = $main_mod, x, exec, ~/dotfiles/scripts/KillActive.sh
bind = $main_mod, x, killactive
bind = $main_mod, f, fullscreen
bind = $main_mod, v, togglefloating
bind = $main_mod, p, pin
bind = $main_mod, i, layoutmsg, togglesplit

# Launcher
bind = $main_mod, r, exec, hyprlauncher

# Game mode
bind = $main_mod, g, exec, ~/dotfiles/scripts/GameMode.sh

# OCR
bind = $main_mod, print, exec, ~/dotfiles/scripts/OCR.sh

# Screenshots
bind = , print, exec, ~/dotfiles/scripts/ScreenShot.sh "active -m output"
bind = ctrl, print, exec, ~/dotfiles/scripts/ScreenShot.sh window
bind = shift, print, exec, ~/dotfiles/scripts/ScreenShot.sh region

# Panel
bind = $main_mod, w, exec, killall waybar || waybar
# bind = $main_mod, w, exec, hyprpanel toggleWindow bar-0

# Focus change
bind = $main_mod, h, movefocus, l
bind = $main_mod, l, movefocus, r
bind = $main_mod, k, movefocus, u
bind = $main_mod, j, movefocus, d
bind = $main_mod, left, movefocus, l
bind = $main_mod, right, movefocus, r
bind = $main_mod, up, movefocus, u
bind = $main_mod, down, movefocus, d

# Hyprswitch
$hyprswitchKey = tab
$hyprswitchReverse = shift

bind = $main_mod, $hyprswitchKey, exec, hyprswitch gui --mod-key $main_mod --key $hyprswitchKey --close mod-key-release --reverse-key=mod=$hyprswitchReverse --sort-recent && hyprswitch dispatch
bind = $main_mod $hyprswitchReverse, $hyprswitchKey, exec, hyprswitch gui --mod-key $main_mod --key $hyprswitchKey --close mod-key-release --reverse-key=mod=$hyprswitchReverse --sort-recent && hyprswitch dispatch -r

# Move windows
bind = $main_mod shift, h,     movewindow, l
bind = $main_mod shift, left,  movewindow, l
bind = $main_mod shift, l,     movewindow, r
bind = $main_mod shift, right, movewindow, r
bind = $main_mod shift, k,     movewindow, u
bind = $main_mod shift, up,    movewindow, u
bind = $main_mod shift, j,     movewindow, d
bind = $main_mod shift, down,  movewindow, d

# Switch workspaces
bind = $main_mod, 1, workspace, 1
bind = $main_mod, 2, workspace, 2
bind = $main_mod, 3, workspace, 3
bind = $main_mod, 4, workspace, 4
bind = $main_mod, 5, workspace, 5
bind = $main_mod, 6, workspace, 6
bind = $main_mod, 7, workspace, 7
bind = $main_mod, 8, workspace, 8
bind = $main_mod, 9, workspace, 9
bind = $main_mod, 0, workspace, 10
bind = $main_mod alt, h,     workspace, e-1
bind = $main_mod alt, left,  workspace, e-1
bind = $main_mod alt, l,     workspace, e+1
bind = $main_mod alt, right, workspace, e+1

# Move window to workspace
bind = $main_mod shift, 1, movetoworkspacesilent, 1
bind = $main_mod shift, 2, movetoworkspacesilent, 2
bind = $main_mod shift, 3, movetoworkspacesilent, 3
bind = $main_mod shift, 4, movetoworkspacesilent, 4
bind = $main_mod shift, 5, movetoworkspacesilent, 5
bind = $main_mod shift, 6, movetoworkspacesilent, 6
bind = $main_mod shift, 7, movetoworkspacesilent, 7
bind = $main_mod shift, 8, movetoworkspacesilent, 8
bind = $main_mod shift, 9, movetoworkspacesilent, 9
bind = $main_mod shift, 0, movetoworkspacesilent, 10

bind = $main_mod ctrl shift, h, movetoworkspace, -1
bind = $main_mod ctrl shift, left, movetoworkspace, -1
bind = $main_mod ctrl shift, l, movetoworkspace, +1
bind = $main_mod ctrl shift, right, movetoworkspace, +1

# Special
bind = $main_mod, s, togglespecialworkspace, magic
bind = $main_mod shift, s, movetoworkspace, special:magic

# Mouse resize
bindm = $main_mod, mouse:272, movewindow
bindm = $main_mod, mouse:273, resizewindow

# Mouse change workspace
binds {
    scroll_event_delay = 0
}
bind = $main_mod, mouse_down, workspace, e+1
bind = $main_mod, mouse_up, workspace, e-1

# Resize
bind = $main_mod ctrl, h,     resizeactive, -50   0
bind = $main_mod ctrl, left,  resizeactive, -50   0
bind = $main_mod ctrl, l,     resizeactive,  50   0
bind = $main_mod ctrl, right, resizeactive,  50   0
bind = $main_mod ctrl, k,     resizeactive,   0 -50
bind = $main_mod ctrl, up,    resizeactive,   0 -50
bind = $main_mod ctrl, j,     resizeactive,   0  50
bind = $main_mod ctrl, down,  resizeactive,   0  50

# Media
# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = alt, m, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Brightness
bind = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 2%+
bind = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 2%-

# Lid
# bindl = ,switch:off:Lid Switch, exec, hyprlock
